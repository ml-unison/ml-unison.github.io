# Identidad visual del curso.
# Fuente: Manual de Identidad Institucional UNISON 2025–2030
# https://identidadbuho.unison.mx/wp-content/uploads/2025/08/MANUAL-DE-IDENTIDAD_25-30_INICIAL-1.pdf
#   Colores del escudo (p. 8), complementarios (p. 9), tipografía (p. 24–27).
# Las tipografías ZapfHumnst BT y Calibri no son libres: el cuerpo de texto usa
# Lato (humanista, cercana a Calibri) y los títulos Montserrat (oficial y libre).
# Si cambias un color aquí, cámbialo también en paquete/rdp/estilo.py
# (la prueba tests/test_marca.py verifica que coincidan).

meta:
  name:
    short: UNISON · Matemáticas
    full: Universidad de Sonora · Departamento de Matemáticas
  link: https://www.unison.mx

color:
  palette:
    azul: "#24398A"          # azul institucional del escudo
    dorado: "#E1B73D"        # dorado del escudo
    ambar: "#EBA93B"
    rojo: "#D5433C"
    verde: "#5CA847"
    cafe: "#946721"
    azul-marino: "#20305A"   # complementario
    azul-medio: "#496EA5"
    azul-claro: "#8DA3C9"
    azul-tenue: "#C0CEE3"
    gris: "#C5C5C5"
    gris-claro: "#F1F1F1"
  foreground: "#1E2433"
  background: "#FFFFFF"
  primary: azul
  secondary: azul-medio
  tertiary: dorado
  success: verde
  warning: ambar
  danger: rojo
  info: azul-medio
  light: gris-claro
  dark: azul-marino

typography:
  fonts:
    - family: Montserrat
      source: google
      weight: [400, 500, 600, 700, 800]
      style: [normal, italic]
    - family: Lato
      source: google
      weight: [300, 400, 700]
      style: [normal, italic]
    - family: JetBrains Mono
      source: google
      weight: [400, 600]
  base:
    family: Lato
    line-height: 1.6
  headings:
    family: Montserrat
    weight: 700
    color: azul-marino
  monospace:
    family: JetBrains Mono
    size: 0.9em
  link:
    color: azul
    decoration: none

logo:
  images:
    escudo: assets/brand/escudo-unison-color.png
    escudo-azul: assets/brand/escudo-unison-azul.png
    letragrama: assets/brand/letragrama-unison.png
    buho-blanco: assets/brand/buho-blanco.png
  small: letragrama
  medium: letragrama
  large: escudo
