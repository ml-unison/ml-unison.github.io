project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!README.md"
    - "!paquete/"
    - "!tests/"
  resources:
    - "assets/brand/"
    - "datos/"
    - "examenes/archivo/*.pdf"
    - "quizzes/exportados/"

profile:
  default: produccion

lang: es

# Datos del curso usados por los shortcodes (colab, quiz) y las páginas
curso:
  nombre: "Reconocimiento de Patrones"
  repo: "ml-unison/ml-unison.github.io"
  rama: "main"
  semestre: "2027-1"

website:
  title: "Reconocimiento de Patrones"
  description: "Curso de aprendizaje automático de la Licenciatura en Ciencias de la Computación, Universidad de Sonora."
  site-url: "https://ml-unison.github.io"
  repo-url: "https://github.com/ml-unison/ml-unison.github.io"
  favicon: assets/brand/favicon.png
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    logo: assets/brand/letragrama-unison.png
    logo-alt: "Universidad de Sonora"
    title: "Reconocimiento de Patrones"
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Temario"
        href: temario.qmd
      - text: "Unidades"
        menu:
          - text: "1 · Introducción y flujo de trabajo"
            href: unidades/01-introduccion/index.qmd
          - text: "2 · Aprendizaje no supervisado"
            href: unidades/02-no-supervisado/index.qmd
          - text: "3 · Fundamentos del aprendizaje supervisado"
            href: unidades/03-fundamentos/index.qmd
          - text: "4 · Modelos lineales"
            href: unidades/04-lineales/index.qmd
          - text: "5 · Árboles y ensambles"
            href: unidades/05-arboles-ensambles/index.qmd
          - text: "6 · Redes neuronales"
            href: unidades/06-redes-neuronales/index.qmd
          - text: "7 · Series de tiempo"
            href: unidades/07-series-tiempo/index.qmd
          - text: "8 · MLOps y despliegue"
            href: unidades/08-mlops/index.qmd
      - text: "Proyecto"
        href: proyecto/index.qmd
      - text: "Evaluación"
        href: evaluacion.qmd
      - text: "Recursos"
        href: recursos.qmd
    right:
      - icon: github
        href: "https://github.com/ml-unison/ml-unison.github.io"
        aria-label: "Repositorio en GitHub"
  page-footer:
    left: |
      Universidad de Sonora · División de Ciencias Exactas y Naturales · Departamento de Matemáticas
    right: |
      Material bajo licencia [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/deed.es); código bajo licencia MIT.

format:
  html:
    theme:
      light: [brand, _extensions/unison/html/unison.scss]
    toc: true
    toc-title: "En esta página"
    number-sections: false
    html-math-method: mathjax
    include-before-body:
      - _extensions/unison/macros.html
    code-copy: true
    lightbox: true

execute:
  freeze: auto
  echo: false
  warning: false

bibliography: referencias.bib
