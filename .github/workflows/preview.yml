name: Vista previa

# Publica la rama de desarrollo en https://ml-unison.github.io/preview/
# Requiere el secreto PREVIEW_TOKEN (token con permiso de escritura en ml-unison/preview).

on:
  push:
    branches: [rediseno-2027]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          uv sync --group dev
          npm ci
      - run: |
          uv run python herramientas/exportar_quizzes.py
      - name: Construir (base /preview/)
        env:
          BASE: /preview/
          SITIO: https://ml-unison.github.io
          RDP_RAMA: rediseno-2027
        run: node herramientas/construir.mjs
      - name: Publicar en ml-unison/preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PREVIEW_TOKEN }}
          external_repository: ml-unison/preview
          publish_branch: gh-pages
          publish_dir: ./_construccion
          force_orphan: true
          enable_jekyll: false
          commit_message: "Vista previa de ${{ github.sha }}"
