[project]
name = "rdp-curso"
version = "2027.1.0"
description = "Entorno de desarrollo del curso Reconocimiento de Patrones (LCC-UNISON)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rdp",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "umap-learn>=0.5.7",
    "plotly>=5.24",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "ipywidgets>=8.1",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
    # Unidad 5
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "shap>=0.46",
    # Unidad 6
    "torch>=2.5",
    "torchvision>=0.20",
    # Unidad 7
    "statsmodels>=0.14",
    # Unidad 8
    "mlflow>=2.18",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "catboost>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "nbmake>=1.5",
    "pytest-xdist>=3.6",
    "python-docx>=1.1",
    "jupytext>=1.19.6",
    "otter-grader>=7.0.0",
]

[tool.uv]
package = false

[tool.uv.sources]
rdp = { path = "paquete", editable = true }
# En Linux (CI) se usa la versión de PyTorch solo para CPU, mucho más ligera.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
