name: Verificar

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: uv sync --group dev
      - name: Pruebas (marca, quizzes, libretas)
        run: uv run pytest -q
      - name: Ejecutar libretas de principio a fin
        run: uv run pytest --nbmake unidades/ -q
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - name: Exportar quizzes
        run: uv run python herramientas/exportar_quizzes.py
      - name: Renderizar sitio
        env:
          QUARTO_PYTHON: .venv/bin/python
        run: quarto render
      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_site" "_site/**/*.html"
          fail: true
