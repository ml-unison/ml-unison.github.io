name: Vista previa

# Publica la rama de desarrollo en https://ml-unison.github.io/preview/
# Requiere el secreto PREVIEW_TOKEN (token con permiso de escritura en ml-unison/preview).

on:
  push:
    branches: [rediseno-2027]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.27
      - run: uv run python herramientas/exportar_quizzes.py
      - name: Renderizar (perfil preview)
        env:
          QUARTO_PYTHON: .venv/bin/python
        run: quarto render --profile preview
      - name: Publicar en ml-unison/preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PREVIEW_TOKEN }}
          external_repository: ml-unison/preview
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
          commit_message: "Vista previa de ${{ github.sha }}"
