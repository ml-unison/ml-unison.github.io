titulo: "Unidad 1 · ¿Qué significa aprender de datos?"
unidad: 1
preguntas:
  - id: u01-p01
    tipo: opcion
    enunciado: |
      ¿En cuál de estas situaciones **tiene menos sentido** usar aprendizaje automático?
    opciones:
      - texto: Calcular el impuesto de una factura a partir de una tasa fija establecida por ley.
        correcta: true
        retro: Hay una regla explícita y conocida; programarla directamente es más simple y exacto.
      - texto: Estimar el almacenamiento de una presa a partir de lluvias y extracciones históricas.
        retro: Existe un patrón, es difícil de describir analíticamente y hay datos históricos.
      - texto: Detectar correos fraudulentos a partir de miles de ejemplos etiquetados.
        retro: Es un caso clásico de clasificación supervisada.
      - texto: Agrupar perfiles de estudiantes según su trayectoria académica.
        retro: Es un problema no supervisado razonable.
    explicacion: |
      Aprender tiene sentido cuando (1) existe un patrón, (2) no sabemos describirlo analíticamente y (3) tenemos datos. En el cálculo del impuesto falla la condición (2).

  - id: u01-p02
    tipo: opcion
    enunciado: |
      Sea $\ell$ una función de pérdida y $\mathcal{D}=\{(\mathbf{x}_i,y_i)\}_{i=1}^n$ una muestra. ¿Cuál expresión corresponde al **riesgo empírico** $E_{\text{in}}(h)$?
    opciones:
      - texto: $\mathbb{E}_{(\mathbf{x},y)\sim P}\left[\ell(h(\mathbf{x}),y)\right]$
        retro: Ese es el riesgo verdadero $E_{\text{out}}(h)$; depende de $P$, que no conocemos.
      - texto: $\frac{1}{n}\sum_{i=1}^n \ell(h(\mathbf{x}_i),y_i)$
        correcta: true
      - texto: $\min_{h\in\mathcal{H}} \sum_{i=1}^n \ell(h(\mathbf{x}_i),y_i)$
        retro: Ese es el valor óptimo del problema ERM, no el riesgo de una $h$ dada.
      - texto: $\Pr\left[\,|E_{\text{in}}(h)-E_{\text{out}}(h)|>\epsilon\,\right]$
        retro: Esa es la probabilidad que acota la desigualdad de Hoeffding.

  - id: u01-p03
    tipo: vf
    enunciado: |
      Si un modelo obtiene $E_{\text{in}} = 0$ en el conjunto de entrenamiento, entonces su error fuera de muestra también será pequeño.
    respuesta: false
    explicacion: |
      Falso. En el experimento con polinomios, el de grado 12 interpola casi todos los puntos ($E_{\text{in}}\approx 0$) y su $E_{\text{out}}$ es enorme: está **sobreajustado**.

  - id: u01-p04
    tipo: numerica
    enunciado: |
      Un clasificador comete errores en 3 de 20 ejemplos de entrenamiento. Con la pérdida 0–1, ¿cuánto vale $E_{\text{in}}$? (escribe un decimal)
    respuesta: 0.15
    tolerancia: 0.001
    explicacion: |
      $E_{\text{in}} = \frac{1}{20}\sum_i \mathbb{1}[h(\mathbf{x}_i)\ne y_i] = 3/20 = 0.15$.

  - id: u01-p05
    tipo: opcion
    enunciado: |
      Dos modelos tienen el mismo error en los datos de entrenamiento. Uno es un polinomio de grado 3 y el otro de grado 12. Según la navaja de Occam, ¿cuál conviene preferir y por qué?
    opciones:
      - texto: El de grado 12, porque puede representar más funciones.
        retro: Poder representar más funciones también significa poder ajustarse al ruido.
      - texto: El de grado 3, porque al ser más simple es menos probable que su buen ajuste se deba al ruido.
        correcta: true
      - texto: Da igual, porque tienen el mismo error de entrenamiento.
        retro: El error de entrenamiento no es lo que nos importa; nos importa el error en datos nuevos.
      - texto: El de grado 12, porque los modelos complejos siempre generalizan mejor con más datos.
        retro: Con muchos datos un modelo complejo puede funcionar bien, pero aquí ambos explican igual lo observado.
    explicacion: |
      Un modelo simple no puede ajustarse a cualquier cosa; si aun así se ajusta a los datos, es más probable que haya capturado el patrón. Simple no significa simplista: un modelo demasiado simple tampoco sirve.

  - id: u01-p06
    tipo: vf
    enunciado: |
      Un programa que guarda en una tabla todos los ejemplos de entrenamiento y responde buscando el ejemplo idéntico tiene $E_{\text{in}} = 0$, así que es un buen modelo.
    respuesta: false
    explicacion: |
      Falso. Memorizar da error cero en los datos vistos, pero ante un caso nuevo el programa no tiene nada que decir. Lo que importa es $E_{\text{out}}$: generalizar, no memorizar.

  - id: u01-p07
    tipo: multiple
    enunciado: |
      ¿Cuáles de estos pasos deben ajustarse **solo** con los datos de entrenamiento para evitar fuga de información?
    opciones:
      - texto: Calcular la media y la desviación estándar para estandarizar.
        correcta: true
      - texto: Imputar valores faltantes con la mediana de cada columna.
        correcta: true
      - texto: Elegir las categorías de una codificación *one-hot*.
        correcta: true
      - texto: Convertir una columna de texto `"2024-05-01"` a tipo fecha.
        retro: Es una transformación determinista que no aprende parámetros de los datos.
    explicacion: |
      Todo paso que **estima parámetros** a partir de los datos (medias, medianas, vocabularios…) debe ajustarse con el conjunto de entrenamiento. Un `Pipeline` de scikit-learn lo garantiza.

  - id: u01-p08
    tipo: opcion
    enunciado: |
      Estás seleccionando entre 30 configuraciones de un modelo. ¿Qué conjunto debes usar para **compararlas**?
    opciones:
      - texto: El conjunto de prueba, porque es el más parecido a producción.
        retro: Si eliges con el conjunto de prueba, su error deja de ser una estimación honesta de $E_{\text{out}}$.
      - texto: Validación (un conjunto aparte o validación cruzada sobre el de entrenamiento).
        correcta: true
      - texto: El conjunto de entrenamiento completo, comparando $E_{\text{in}}$.
        retro: $E_{\text{in}}$ favorece a los modelos más complejos; no detecta el sobreajuste.
      - texto: Cualquiera; con 30 configuraciones la diferencia es despreciable.
        retro: Con más configuraciones, el sesgo de selección es **mayor**, no menor.

  - id: u01-p09
    tipo: opcion
    enunciado: |
      ¿A qué paradigma corresponde entrenar un modelo para predecir la siguiente palabra de un texto, usando millones de textos **sin etiquetar a mano**?
    opciones:
      - texto: Aprendizaje no supervisado clásico (agrupamiento).
      - texto: Aprendizaje auto-supervisado.
        correcta: true
      - texto: Aprendizaje por refuerzo.
      - texto: Aprendizaje supervisado con etiquetas humanas.
    explicacion: |
      Las "etiquetas" (la siguiente palabra) se obtienen de los propios datos. Es la base del preentrenamiento de los modelos de lenguaje (Unidad 6).

  - id: u01-p10
    tipo: vf
    enunciado: |
      Si eliminamos de los datos la columna "sexo", un modelo de crédito ya no puede producir decisiones con sesgo de sexo.
    respuesta: false
    explicacion: |
      Falso. Otras variables (ocupación, historial, patrones de compra…) pueden estar correlacionadas con el atributo eliminado y funcionar como **variables sustitutas** (*proxies*).

  - id: u01-p11
    tipo: opcion
    enunciado: |
      Al leer un archivo, `df.info()` muestra que la columna `fecha` es de tipo `object` (texto). ¿Qué problema tiene dejarla así?
    opciones:
      - texto: Ninguno; pandas convierte el texto a fecha cuando hace falta.
        retro: pandas no lo hace automáticamente al agrupar u ordenar.
      - texto: No se puede extraer el mes ni agrupar por periodos, y el orden es alfabético, no cronológico.
        correcta: true
      - texto: Ocupa más memoria, pero los cálculos son correctos.
        retro: El problema no es la memoria; muchas operaciones con fechas no funcionan o dan resultados equivocados.
      - texto: Solo es un problema si la columna tiene valores faltantes.
    explicacion: |
      Hay que convertirla con `pd.to_datetime`. Con texto, "2020/10/01" queda antes que "2020/2/01" y no existen `.dt.month` ni `resample`.

  - id: u01-p12
    tipo: vf
    enunciado: |
      En una serie de registros diarios, si `df.isna().sum()` da cero en todas las columnas, entonces no faltan datos.
    respuesta: false
    explicacion: |
      Falso. Un día sin registro no aparece como `NaN`: simplemente no está la fila. Hay que comparar contra el rango completo de fechas, por ejemplo con `reindex(pd.date_range(...))`.

  - id: u01-p13
    tipo: opcion
    enunciado: |
      Unes una tabla de 11,533 registros diarios con un catálogo de presas usando `merge` por la clave de la presa. El resultado tiene 12,800 filas. ¿Qué pasó?
    opciones:
      - texto: Nada raro; `merge` siempre agrega filas.
        retro: Una unión izquierda contra un catálogo con claves únicas conserva el número de filas.
      - texto: Alguna clave aparece más de una vez en el catálogo, y sus registros se duplicaron.
        correcta: true
      - texto: Había valores faltantes en la columna de almacenamiento.
        retro: Los faltantes en otras columnas no cambian el número de filas de la unión.
      - texto: pandas agregó filas para las fechas faltantes.
        retro: "`merge` no inventa fechas; eso lo haría un `reindex`."
    explicacion: |
      Si una clave está repetida en la tabla derecha, cada registro de la izquierda con esa clave se multiplica. Por eso conviene usar `validate="many_to_one"` y comparar el número de filas antes y después.

  - id: u01-p14
    tipo: opcion
    enunciado: |
      En un conjunto de datos de casas, la columna "calidad de la cocina" toma los valores *Excelente*, *Buena*, *Regular* y *Mala*. ¿Qué codificación es más adecuada para un modelo lineal?
    opciones:
      - texto: One-hot, porque es una variable categórica.
        retro: Funciona, pero desperdicia el orden natural de las categorías.
      - texto: Ordinal (Mala = 0, Regular = 1, Buena = 2, Excelente = 3), porque las categorías tienen un orden.
        correcta: true
      - texto: Dejarla como texto; el modelo aprende el orden solo.
        retro: Los modelos de scikit-learn requieren números.
      - texto: Eliminarla, porque las variables categóricas no aportan información.
    explicacion: |
      Cuando las categorías tienen un orden con sentido, una codificación ordinal conserva esa información en una sola columna. One-hot es la opción para categorías **sin** orden (barrio, color, tipo de techo).

  - id: u01-p15
    tipo: vf
    enunciado: |
      En el conjunto de casas, la columna "calidad de la alberca" tiene 99 % de valores faltantes, así que lo correcto es imputarlos con la categoría más frecuente.
    respuesta: false
    explicacion: |
      Falso. Ahí el faltante **significa algo**: la casa no tiene alberca. Lo correcto es codificarlo como su propia categoría ("sin alberca"). Antes de imputar hay que preguntarse por qué falta el dato.

  - id: u01-p16
    tipo: numerica
    enunciado: |
      Estandarizas una columna con media 50 y desviación estándar 4, calculadas en el conjunto de entrenamiento. ¿Qué valor queda para un ejemplo de prueba con valor 58?
    respuesta: 2
    tolerancia: 0.001
    explicacion: |
      $z = (58 - 50)/4 = 2$. La media y la desviación son las del **entrenamiento**: el conjunto de prueba se transforma con los mismos parámetros, nunca con los suyos.

