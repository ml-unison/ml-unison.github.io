name: Verificar

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: |
          uv sync --group dev
          npm ci
      - name: Pruebas (marca, quizzes, libretas)
        run: uv run pytest -q
      - name: Ejecutar libretas de principio a fin
        env:
          RDP_RAPIDO: "1"   # las libretas de redes entrenan menos épocas
          # Varias libretas a la vez con OpenMP (LightGBM, HistGradientBoosting, PyTorch)
          # se estorban en las 4 CPU del CI: un hilo por proceso y sin espera activa.
          OMP_NUM_THREADS: "1"
          OMP_WAIT_POLICY: PASSIVE
        run: uv run pytest --nbmake --nbmake-timeout=900 -n 4 unidades/*/ejemplos -q
      # Los datos de las láminas (presentaciones/datos/*.json) se versionan; se
      # regeneran a mano con herramientas/datos_presentaciones.py (las redes tardan).
      - name: Quizzes exportados
        run: uv run python herramientas/exportar_quizzes.py
      - name: Construir sitio y presentaciones
        run: node herramientas/construir.mjs
      - name: Revisar enlaces
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/_construccion" "_construccion/**/*.html"
          fail: true
