name: Publicar sitio

# Publica main en https://ml-unison.github.io
# Requiere: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: |
          uv sync --group dev
          npm ci
      - run: |
          uv run python herramientas/datos_presentaciones.py
          uv run python herramientas/exportar_quizzes.py
      - name: Construir (producción)
        env:
          BASE: /
          RDP_RAMA: main
        run: node herramientas/construir.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _construccion
  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
